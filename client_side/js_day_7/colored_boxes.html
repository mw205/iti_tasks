<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloredboxes</title>
    <style>
        .red,
        .green,
        .blue {
            width: 150px;
            height: 150px;
            display: inline-block;
            margin: 0px 10px;
        }

        .red {
            background-color: red;
        }

        .blue {

            background-color: blue;
        }

        .green {
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="red"></div>
    <div class="green"></div>
    <div class="blue"></div>
    <script src="colored_box.js"></script>
</body>

</html>
