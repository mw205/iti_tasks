version: "3.8"

services:
  db:
    image: postgres:15
    container_name: orders-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"

  app:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: orders-app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders_db
    ports:
      - "3000:3000"
