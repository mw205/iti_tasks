<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            padding: 28px 32px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #1f2a37;
            text-align: center;
        }

        p.description {
            margin: 0 0 24px;
            color: #556575;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3b47;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9dfe7;
            border-radius: 8px;
            background: #f8fbff;
            color: #1f2a37;
            font-size: 0.98rem;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #5b8def;
            box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.14);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: auto;
            height: auto;
            margin: 0;
        }

        .checkbox-group label {
            display: inline;
            margin: 0;
            font-weight: 400;
            color: #4b5b6d;
        }

        button {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2563eb;
        }

        .footer-text {
            margin-top: 18px;
            text-align: center;
            font-size: 0.94rem;
            color: #6b7a8f;
        }
    </style>
    <script src="main.js"></script>
</head>

<body>
    <div class="container">
        <h1>Create Your Account</h1>
        <p class="description">Complete the fields below to register for access to the site.</p>

        <form>
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" required />
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required />
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirmPassword" placeholder="Repeat your password"
                    required />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+123 456 7890" />
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select an option</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="nonbinary">Non-binary</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms">I agree to the terms and conditions.</label>
            </div>

            <button type="submit">Register</button>
        </form>

        <p class="footer-text">Already have an account? <a href="#">Sign in</a></p>
    </div>
</body>

</html>
