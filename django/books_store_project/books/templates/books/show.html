{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
    <style>
        .detail-layout,
        .detail-summary,
        .detail-notes {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .detail-layout {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 28px;
            padding: 32px;
            margin-top: 24px;
        }

        .detail-cover {
            min-height: 460px;
            overflow: hidden;
            border-radius: 24px;
            background: linear-gradient(160deg, #cf7c52, #7d3f2c);
        }

        .detail-cover img {
            width: 100%;
            height: 100%;
            min-height: 460px;
            display: block;
            object-fit: cover;
        }

        .detail-copy p,
        .detail-summary p,
        .detail-notes p {
            color: var(--muted);
            line-height: 1.75;
        }

        .detail-facts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 28px;
        }

        .detail-fact {
            padding: 18px;
            border-radius: 20px;
            background: var(--surface-strong);
            border: 1px solid rgba(73, 53, 39, 0.08);
        }

        .detail-fact strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .detail-summary,
        .detail-notes {
            margin-top: 24px;
            padding: 28px;
        }

        @media (max-width: 960px) {
            .detail-layout,
            .detail-facts {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <section class="detail-layout">
        <div class="detail-cover">
            {% if book.image %}
                <img src="{{ book.image.url }}" alt="{{ book.title }} cover">
            {% else %}
                <div style="padding: 100px; text-align: center; color: var(--muted);">No Cover Uploaded</div>
            {% endif %}
        </div>

        <div class="detail-copy">
            <h1>{{ book.title }}</h1>

            <p>{{ book.brief }}</p>

            <div class="detail-facts">
                <div class="detail-fact">
                    <span class="label">Price</span>
                    <strong>${{ book.price }}</strong>
                </div>
                <div class="detail-fact">
                    <span class="label">Pages</span>
                    <strong>{{ book.no_of_page }}</strong>
                </div>
            </div>
            <div class="detail-fact" style="margin-top: 8px">
                <span class="label">Author</span>
                <strong>{{ book.author }}</strong>
            </div>

            <div class="actions" style="margin-top: 32px; display: flex; gap: 16px;">
                <a class="btn btn-save" href="{% url 'books:edit' book.id %}" style="background: var(--ink); color: #fffaf2; text-decoration: none; padding: 14px 22px; border-radius: 999px; flex: 1; text-align: center;">Edit Book</a>
                <a class="btn btn-cancel" href="{% url 'books:delete' book.id %}" style="background: rgba(143, 63, 34, 0.12); border: 1px solid rgba(143, 63, 34, 0.2); color: var(--accent-dark); text-decoration: none; padding: 14px 22px; border-radius: 999px; flex: 1; text-align: center;">Delete Book</a>
            </div>
        </div>
    </section>

{% endblock %}
